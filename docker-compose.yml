services:
  inventario:
    build: .
    image: inventario:latest
    container_name: inventario
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Variables (INVENTARIO_STORAGE, INVENTARIO_DB_DSN…) en un archivo .env junto
    # a este compose, que NO se versiona: contiene la contraseña de la base.
    # Copiar .env.example como .env y completarlo.
    env_file:
      - path: .env
        required: true
    volumes:
      # Solo se usa con INVENTARIO_STORAGE=excel. En Proxmox, apuntar a un disco con backup.
      - ./data:/app/data
    # Endurecimiento: sistema de archivos de solo lectura salvo /app/data y /tmp.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Que los registros no llenen el disco del servidor.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 15s # permite terminar la última escritura
