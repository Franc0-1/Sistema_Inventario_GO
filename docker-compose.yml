services:
  inventario:
    build: .
    container_name: inventario
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Variables (INVENTARIO_STORAGE, INVENTARIO_DB_DSN…) en un archivo .env junto
    # a este compose, que NO se versiona: contiene la contraseña de la base.
    env_file:
      - path: .env
        required: false
    volumes:
      # Solo se usa con INVENTARIO_STORAGE=excel. En Proxmox, apuntar a un disco con backup.
      - ./data:/app/data
    stop_grace_period: 15s # permite terminar la última escritura
